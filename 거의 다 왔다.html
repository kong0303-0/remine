// 이미지 압축 유틸리티 (로컬 스토리지 5MB 한계 극복 및 성능 최적화용)
const compressImage = (dataUrl, maxWidth = 1000) => {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = dataUrl;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height = height * (maxWidth / width);
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const mimeType = dataUrl.startsWith('data:image/png') ? 'image/png' : (dataUrl.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg');
      resolve(canvas.toDataURL(mimeType, 0.7)); 
    };
    img.onerror = () => resolve(dataUrl);
  });
};

const MoodStep = ({ moods, scrollY, textData, onTextUpdate, onMoodClick, onMoodSwipe, toggleLike, handleFileUpload, onBackToStart, showGridOnly, isEditMode, userName, layoutHeight }) => {
  const lh = layoutHeight || 2160;
  const s = showGridOnly ? lh : (scrollY || 0);
  const opacity1 = showGridOnly ? 0 : Math.max(0, Math.min(1, 1 - s / lh));
  const opacity2 = showGridOnly ? 1 : Math.max(0, Math.min(1, s / lh));

  const [draggedSlice, setDraggedSlice] = useState({ id: null, tx: 0, ty: 0, opacity: 1 });
  const [pressedSliceId, setPressedSliceId] = useState(null);
  const lastTapRef = useRef({ id: null, time: 0 });
  const touchStartRef = useRef(null);

  const handleSliceClick = (mood) => {
    const now = Date.now();
    const timeDiff = now - lastTapRef.current.time;
    if (lastTapRef.current.id === mood.id && timeDiff < 350) {
      setPressedSliceId(mood.id);
      setTimeout(() => {
        onMoodClick(mood);
        setPressedSliceId(null);
      }, 300);
      lastTapRef.current = { id: null, time: 0 };
    } else {
      lastTapRef.current = { id: mood.id, time: now };
    }
  };

  const handleTouchStart = (e, moodId) => {
    const touch = e.touches ? e.touches[0] : e;
    const svgObj = e.currentTarget.viewportElement || e.currentTarget;
    const rect = svgObj.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    const startX = touch.clientX;
    const startY = touch.clientY;
    const startDist = Math.sqrt((startX - centerX)**2 + (startY - centerY)**2);
    
    touchStartRef.current = {
      moodId,
      startX,
      startY,
      startDist,
      centerX,
      centerY
    };
    
    setDraggedSlice({ id: moodId, tx: 0, ty: 0, opacity: 1 });
  };

  const handleTouchMove = (e) => {
    if (!touchStartRef.current) return;
    
    const touch = e.touches ? e.touches[0] : e;
    const { moodId, startX, startY, startDist, centerX, centerY } = touchStartRef.current;
    
    const endX = touch.clientX;
    const endY = touch.clientY;
    
    const endDist = Math.sqrt((endX - centerX)**2 + (endY - centerY)**2);
    const dragDist = Math.sqrt((endX - startX)**2 + (endY - startY)**2);
    
    if (endDist > startDist && dragDist > 5) {
      let vx = 0;
      let vy = 0;
      
      // Lock drag vector to mathematically perfect radial angles for all 8 slices
      if (moodId === 8) { // 01 Exotic (0 degrees)
        vx = 0; vy = -1;
      } else if (moodId === 2) { // 02 Romantic (45 degrees)
        vx = 0.7071; vy = -0.7071;
      } else if (moodId === 3) { // 03 Elegance (90 degrees)
        vx = 1; vy = 0;
      } else if (moodId === 1) { // 04 Sophisticated (135 degrees)
        vx = 0.7071; vy = 0.7071;
      } else if (moodId === 6) { // 05 Modern (180 degrees)
        vx = 0; vy = 1;
      } else if (moodId === 7) { // 06 Minimal (225 degrees)
        vx = -0.7071; vy = 0.7071;
      } else if (moodId === 4) { // 07 Active (270 degrees)
        vx = -1; vy = 0;
      } else if (moodId === 5) { // 08 Country (315 degrees)
        vx = -0.7071; vy = -0.7071;
      }
      
      const DAMPING = 0.65; // Damped motion: follows slightly slower than the finger
      const effectiveDist = dragDist * DAMPING;
      const tx = vx * effectiveDist;
      const ty = vy * effectiveDist;
      const normalizedDist = Math.min(1, effectiveDist / 200);
      const opacity = Math.max(0, 1 - Math.pow(normalizedDist, 2.2));
      
      setDraggedSlice({ id: moodId, tx, ty, opacity });
    }
  };

  const handleTouchEnd = (e, mood) => {
    if (!touchStartRef.current || touchStartRef.current.moodId !== mood.id) return;
    
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const endX = touch.clientX;
    const endY = touch.clientY;
    const { startX, startY, startDist, centerX, centerY } = touchStartRef.current;
    
    const endDist = Math.sqrt((endX - centerX)**2 + (endY - centerY)**2);
    const dragDist = Math.sqrt((endX - startX)**2 + (endY - startY)**2);
    
    touchStartRef.current = null;
    
    const DAMPING = 0.65;
    const effectiveDist = dragDist * DAMPING;
    
    // Trigger styling transition only after dragging far outward until near-transparency
    if (effectiveDist >= 170 && endDist > startDist) {
      if (onMoodSwipe) {
        onMoodSwipe(mood);
      }
    }
    
    setDraggedSlice({ id: null, tx: 0, ty: 0, opacity: 1 });
  };

  const handleTouchCancel = () => {
    touchStartRef.current = null;
    setDraggedSlice({ id: null, tx: 0, ty: 0, opacity: 1 });
  };

  const svgRef = useRef(null);

  useEffect(() => {
    const svgEl = svgRef.current;
    if (!svgEl) return;

    const handleTouchStartRaw = (e) => {
      const pathEl = e.target.closest('path');
      if (!pathEl) return;
      
      const moodIdAttr = pathEl.getAttribute('data-mood-id');
      if (!moodIdAttr) return;
      const moodId = parseInt(moodIdAttr, 10);
      
      handleTouchStart(e, moodId);
    };

    const handleTouchMoveRaw = (e) => {
      if (touchStartRef.current) {
        if (e.cancelable) {
          e.preventDefault();
        }
        handleTouchMove(e);
      }
    };

    const handleTouchEndRaw = (e) => {
      if (touchStartRef.current) {
        const moodId = touchStartRef.current.moodId;
        const mood = moods.find(m => m.id === moodId);
        if (mood) {
          handleTouchEnd(e, mood);
        }
      }
    };

    svgEl.addEventListener('touchstart', handleTouchStartRaw, { passive: false });
    svgEl.addEventListener('touchmove', handleTouchMoveRaw, { passive: false });
    svgEl.addEventListener('touchend', handleTouchEndRaw, { passive: false });

    return () => {
      svgEl.removeEventListener('touchstart', handleTouchStartRaw);
      svgEl.removeEventListener('touchmove', handleTouchMoveRaw);
      svgEl.removeEventListener('touchend', handleTouchEndRaw);
    };
  }, [moods]);

  return (
    <div className={`w-[1620px] bg-[#ededf2] text-[#575759] selection:bg-[#575759]/10 relative overflow-x-hidden`} style={{ height: showGridOnly ? `${lh}px` : 'auto', minHeight: showGridOnly ? 'none' : `${lh * 2}px`, overflow: showGridOnly ? 'hidden' : 'visible' }}>
      <style>{`
        @keyframes heart-pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } } 
        .animate-heart-pop { animation: heart-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes slice-press {
          0% { transform: scale(1); filter: brightness(1); }
          45% { transform: scale(0.972); filter: brightness(1.06); }
          100% { transform: scale(1); filter: brightness(1); }
        }
        .animate-slice-press {
          animation: slice-press 0.42s cubic-bezier(0.25, 1, 0.5, 1) forwards;
          transform-origin: 696.8px 696.8px !important;
        }
      `}</style>

      {/* ==================== SLIDE 1: 선택1 ==================== */}
      {!showGridOnly && (
        <section 
          className="w-[1620px] absolute left-0 top-0 pointer-events-none" 
          style={{ height: `${lh}px`, opacity: opacity1, transition: 'opacity 0.1s ease-out' }}
        >

// --- [화면 4] MoodDetailView ---
const MoodDetailView = ({ mood, layoutHeight, onBack }) => {
  if (!mood) return null;

  const containerRef = useRef(null);
  const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
  const dragOffsetRef = useRef({ x: 0, y: 0 });
  const touchStartPos = useRef({ x: 0, y: 0 });
  const hasTriggered = useRef(false);

  // Keep dragOffsetRef in sync with dragOffset state to avoid re-binding touch listeners during drags
  useEffect(() => {
    dragOffsetRef.current = dragOffset;
  }, [dragOffset]);

  useEffect(() => {
    const rootEl = document.getElementById('root');
    const originalOverflow = rootEl ? rootEl.style.overflow : '';
    const originalRootBg = rootEl ? rootEl.style.backgroundColor : '';
    const originalBodyBg = document.body.style.backgroundColor;
    const originalHtmlBg = document.documentElement.style.backgroundColor;
    
    if (rootEl) {
      rootEl.style.overflow = 'hidden';
      rootEl.style.backgroundColor = 'transparent';
      rootEl.scrollTop = 0;
      // Overwrite any browser automatic scroll-restoration behaviors
      setTimeout(() => { if (rootEl) rootEl.scrollTop = 0; }, 20);
      setTimeout(() => { if (rootEl) rootEl.scrollTop = 0; }, 100);
      setTimeout(() => { if (rootEl) rootEl.scrollTop = 0; }, 300);
    }
    document.body.style.backgroundColor = 'transparent';
    document.documentElement.style.backgroundColor = 'transparent';

    return () => {
      if (rootEl) {
        rootEl.style.overflow = originalOverflow || 'auto';
        rootEl.style.backgroundColor = originalRootBg || '#ffffff';
      }
      document.body.style.backgroundColor = originalBodyBg || '#ffffff';
      document.documentElement.style.backgroundColor = originalHtmlBg || '';
    };
  }, []);

  // Track swipe gestures in any direction to trigger navigate back to Page 3 on finger release (touchend)
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    
    const handleTouchStart = (e) => {
      if (e.touches.length > 0) {
        touchStartPos.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
        hasTriggered.current = false;
      }
    };

    const handleTouchMove = (e) => {
      if (e.touches.length > 0 && !hasTriggered.current) {
        const dx = e.touches[0].clientX - touchStartPos.current.x;
        const dy = e.touches[0].clientY - touchStartPos.current.y;
        
        // Scale conversion with damping (0.65x) so the moodboard moves slightly slower than the finger
        const scale = getAppScale();
        const DAMPING = 0.65;
        const dxContainer = (dx / scale) * DAMPING;
        const dyContainer = (dy / scale) * DAMPING;

        setDragOffset({ x: dxContainer, y: dyContainer });
      }
      if (e.cancelable) {
        e.preventDefault();
      }
    };

    const handleTouchEnd = () => {
      if (!hasTriggered.current) {
        const finalOffset = dragOffsetRef.current;
        const distance = Math.sqrt(finalOffset.x * finalOffset.x + finalOffset.y * finalOffset.y);
        
        if (distance > 130) { // Scaled threshold matching the 0.65 damping
          hasTriggered.current = true;
          onBack();
        } else {
          // Snap back to center and restore opacity to 1
          setDragOffset({ x: 0, y: 0 });
        }
      }
    };
    
    el.addEventListener('touchstart', handleTouchStart, { passive: false });
    el.addEventListener('touchmove', handleTouchMove, { passive: false });
    el.addEventListener('touchend', handleTouchEnd, { passive: false });
    
    return () => {
      el.removeEventListener('touchstart', handleTouchStart);
      el.removeEventListener('touchmove', handleTouchMove);
      el.removeEventListener('touchend', handleTouchEnd);
    };
  }, [onBack]);
  
  const getMoodboardImage = (moodId) => {
    const map = {
      8: '디자인!/무보1.jpg', // 01 이국적인
      2: '디자인!/무보2.jpg', // 02 로맨틱한
      3: '디자인!/무보3.jpg', // 03 우아한
      1: '디자인!/바꿔4최종.jpg', // 04 지적인
      6: '디자인!/무보5.jpg', // 05 모던한
      7: '디자인!/무보6.jpg', // 06 미니멀한
      4: '디자인!/무보7.jpg', // 07 활동적인
      5: '디자인!/무보8.jpg'  // 08 소박한
    };
    return map[moodId] || '';
  };

  const imageSrc = getMoodboardImage(mood.id);

  const distance = Math.sqrt(dragOffset.x * dragOffset.x + dragOffset.y * dragOffset.y);
  
  // Slower, smoother, more gradual fade during drag
  const normalizedDistance = Math.min(1, distance / 220);
  const opacity = Math.max(0, 1 - Math.pow(normalizedDistance, 2.5));

  return (
    <div
      ref={containerRef}
      style={{
        position: 'relative',
        width: '1620px',
        height: `${layoutHeight}px`, // Explicit subpixel height to prevent layout calculation mismatch
        overflow: 'hidden', // Clip exactly to the page container
        backgroundColor: 'transparent',
        margin: 0,
        padding: 0,
        opacity: opacity,
        transition: (dragOffset.x === 0 && dragOffset.y === 0) ? 'opacity 0.3s ease-out' : 'none'
      }}
    >
      {/* Moodboard Image mapped exactly to the 1620x2160 container bounds (no cutoff or offsets) */}
      {imageSrc && (
        <img
          src={imageSrc}
          alt={`${mood.name} Moodboard`}
          style={{
            position: 'absolute',
            left: 0,
            top: 0,
            width: '100%',
            height: '100%',
            objectFit: 'fill',
            display: 'block',
            border: 'none',
            margin: 0,
            padding: 0,
            pointerEvents: 'none',
            userSelect: 'none',
            transform: `translate(${dragOffset.x}px, ${dragOffset.y}px)`,
            transition: (dragOffset.x === 0 && dragOffset.y === 0) ? 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)' : 'none'
          }}
        />
      )}
    </div>
  );
};

// --- [화면 4 하위 컴포넌트] DraggableItem (업그레이드: 자유로운 배치 및 테두리 제거) ---
const DraggableItem = ({ item, updateItem, deleteItem, isEditMode }) => {
  const [isDragging, setIsDragging] = useState(false);
  const [isResizing, setIsResizing] = useState(false);
  const [startPos, setStartPos] = useState({ x: 0, y: 0 });
  
  const onMouseDownMove = (e) => { 
    if (!isEditMode) return;
    if (e.target.closest('.resize-handle') || e.target.tagName === 'TEXTAREA' || e.target.closest('.delete-btn')) return; 
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    setIsDragging(true); 
    const scale = getAppScale();
    setStartPos({ x: clientX - item.x * scale, y: clientY - item.y * scale }); 
  };
  
  const onMouseDownResize = (e) => { 
    if (!isEditMode) return;
    e.stopPropagation(); 
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    setIsResizing(true); 
    const scale = getAppScale();
    setStartPos({ x: clientX, y: clientY, w: item.width, h: item.height }); 
  };

  useEffect(() => {
    const onMouseMove = (e) => { 
      const clientX = e.type.includes('touch') ? (e.touches[0] ? e.touches[0].clientX : e.changedTouches[0].clientX) : e.clientX;
      const clientY = e.type.includes('touch') ? (e.touches[0] ? e.touches[0].clientY : e.changedTouches[0].clientY) : e.clientY;
      const scale = getAppScale();
      if (isDragging) { 
        updateItem(item.id, { x: (clientX - startPos.x) / scale, y: (clientY - startPos.y) / scale }); 
      } 
      if (isResizing) { 
        const deltaX = clientX - startPos.x; 
        const deltaY = clientY - startPos.y; 
        updateItem(item.id, { width: Math.max(50, startPos.w + deltaX / scale), height: Math.max(30, startPos.h + deltaY / scale) }); 
      } 
    };
    const onMouseUp = () => { setIsDragging(false); setIsResizing(false); };
    if (isDragging || isResizing) { 
      window.addEventListener('mousemove', onMouseMove); 
      window.addEventListener('mouseup', onMouseUp); 
      window.addEventListener('touchmove', onMouseMove, { passive: false });
      window.addEventListener('touchend', onMouseUp);
    }
    return () => { 
      window.removeEventListener('mousemove', onMouseMove); 
      window.removeEventListener('mouseup', onMouseUp); 
      window.removeEventListener('touchmove', onMouseMove);
      window.removeEventListener('touchend', onMouseUp);
    };
  }, [isDragging, isResizing, startPos, item.id, updateItem]);

  // 텍스트가 아닌 경우(사진/영상) 배경색과 테두리를 없애서 자유로운 느낌을 줌
  const containerClass = `group absolute select-none touch-none transition-shadow ${isDragging ? 'z-[100]' : 'z-50'} ${
    item.type === 'text' ? 'bg-white shadow-lg border-2 border-gray-100 rounded-2xl' : ''
  } ${isDragging ? 'shadow-2xl scale-[1.01]' : ''}`;

  return (
    <div style={{ left: item.x, top: item.y, width: item.width, height: item.height }} onMouseDown={onMouseDownMove} onTouchStart={onMouseDownMove} className={containerClass}>
      <div className="w-full h-full relative">
        {item.type === 'image' && <img src={item.content} alt="Mood" className="w-full h-full object-contain pointer-events-none" />}
        {item.type === 'video' && <video src={item.content} className="w-full h-full object-contain pointer-events-none" autoPlay loop muted playsInline />}
        {item.type === 'text' && (
          <textarea className={`w-full h-full p-6 bg-transparent outline-none resize-none font-bold text-xl leading-relaxed text-gray-800 placeholder-gray-300 ${!isEditMode && 'pointer-events-none'}`} value={String(item.content)} onChange={(e) => isEditMode && updateItem(item.id, { content: e.target.value })} placeholder="문구를 적어주세요..." readOnly={!isEditMode} />
        )}
